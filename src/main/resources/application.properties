logging.level.org.springframework.security=TRACE

spring.application.name=securing-web
spring.profiles.default=local

# Flyway owns the schema; Hibernate only checks entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Replicas x pool size must stay under the DB's connection limit
spring.datasource.hikari.maximum-pool-size=5

# Expose only health, with separate liveness/readiness endpoints for K8s probes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true